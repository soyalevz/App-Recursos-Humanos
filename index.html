<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RRHH — Empresas Salfate</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo"><i class="ti ti-users"></i></div>
    <div>
      <div class="app-title">Empresas Salfate</div>
      <div class="app-sub">Gestion de Personal</div>
    </div>
  </div>
  <button class="add-btn-header" onclick="openForm()"><i class="ti ti-plus"></i></button>
</header>

<nav class="nav-tabs">
  <button class="nav-tab active" onclick="setTab('trabajadores')" data-tab="trabajadores">
    <i class="ti ti-users"></i><span>Personal</span>
  </button>
  <button class="nav-tab" onclick="setTab('alertas')" data-tab="alertas">
    <i class="ti ti-bell"></i><span>Alertas</span>
    <span class="nav-badge" id="nav-badge" style="display:none">0</span>
  </button>
  <button class="nav-tab" onclick="setTab('resumen')" data-tab="resumen">
    <i class="ti ti-chart-bar"></i><span>Resumen</span>
  </button>
</nav>

<div class="filters-bar" id="filters-bar">
  <input id="buscar" class="filter-input" placeholder="Buscar nombre o RUT..." oninput="render()">
  <div class="filter-row">
    <select id="filtro-cc" class="filter-select" onchange="render()"><option value="">Todas las obras</option></select>
    <select id="filtro-tipo" class="filter-select" onchange="render()">
      <option value="">Todos</option>
      <option value="indefinido">Indefinido</option>
      <option value="plazo_fijo">Plazo fijo</option>
      <option value="obra_faena">Obra/Faena</option>
    </select>
    <select id="filtro-alerta" class="filter-select" onchange="render()">
      <option value="">Todos</option>
      <option value="alerta">Con alerta</option>
      <option value="ok">Sin alerta</option>
    </select>
  </div>
</div>

<div id="loading-screen" class="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Cargando trabajadores...</div>
</div>

<main id="main-content" class="main-content" style="display:none"></main>

<!-- MODAL FORMULARIO TRABAJADOR -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Agregar trabajador</span>
      <button class="modal-close" onclick="closeForm()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-fields">
      <div class="form-section-title">Datos personales</div>
      <div class="form-group full"><label>Nombre completo *</label><input id="f-nombre" placeholder="JUAN PEREZ GONZALEZ"></div>
      <div class="form-group"><label>RUT *</label><input id="f-rut" placeholder="12.345.678-9"></div>
      <div class="form-group"><label>Cargo</label><input id="f-cargo" placeholder="Conductor Camion"></div>
      <div class="form-group"><label>Correo</label><input id="f-correo" type="email" placeholder="correo@gmail.com"></div>
      <div class="form-group"><label>Telefono</label><input id="f-telefono" placeholder="56912345678"></div>

      <div class="form-section-title">Contrato</div>
      <div class="form-group"><label>Tipo de contrato *</label>
        <select id="f-tipo" onchange="toggleFin()">
          <option value="plazo_fijo">Plazo fijo</option>
          <option value="indefinido">Indefinido</option>
          <option value="obra_faena">Obra / Faena</option>
        </select>
      </div>
      <div class="form-group"><label>Obra / Centro de costo *</label>
        <select id="f-cc" onchange="toggleCCManual()">
          <option value="TALLER">TALLER</option>
          <option value="OFICINA CENTRAL">OFICINA CENTRAL</option>
          <option value="VARIAS OBRAS">VARIAS OBRAS</option>
          <option value="CONTRATO BESALCO - EFE">CONTRATO BESALCO - EFE</option>
          <option value="MOLLER - LOS LITRES">MOLLER - LOS LITRES</option>
          <option value="CASA RESERVA">CASA RESERVA</option>
          <option value="CONCRETA - EL MARISCAL 3">CONCRETA - EL MARISCAL 3</option>
          <option value="CONCRETA - LA PLATINA C">CONCRETA - LA PLATINA C</option>
          <option value="POZO - HUYACANES">POZO - HUYACANES</option>
          <option value="CYPCO - PUENTE ALTO">CYPCO - PUENTE ALTO</option>
          <option value="OBRA EBCO - CAMINO DEL CHIN">OBRA EBCO - CAMINO DEL CHIN</option>
          <option value="otro">Otra obra...</option>
        </select>
      </div>
      <div class="form-group full" id="grp-cc-manual" style="display:none"><label>Nombre de la obra *</label><input id="f-cc-manual" placeholder="Nombre de la obra"></div>
      <div class="form-group"><label>Fecha de inicio *</label><input id="f-inicio" type="date"></div>
      <div class="form-group" id="grp-fin"><label>Fecha fin contrato *</label><input id="f-fin" type="date"></div>
      <div class="form-group"><label>Liquido ($) *</label><input id="f-liquido" type="number" placeholder="800000"></div>
      <div class="form-group"><label>Horario</label>
        <select id="f-horario">
          <option value="art22">Art. 22 (sin control)</option>
          <option value="normal">Jornada ordinaria</option>
        </select>
      </div>

      <div class="form-section-title">Documentos y vencimientos</div>
      <div class="form-group"><label>Anexo HH.EE — fecha ingreso</label><input id="f-anexo" type="date"></div>
      <div class="form-group"><label>Vencimiento RUT</label><input id="f-venc-rut" type="date"></div>
      <div class="form-group full">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="f-tiene-licencia" onchange="toggleLicencia()" style="width:auto;padding:0">
          Tiene licencia de conducir
        </label>
      </div>
      <div class="form-group full" id="grp-licencia" style="display:none">
        <label>Vencimiento licencia</label>
        <input id="f-venc-licencia" type="date">
      </div>

      <div class="form-section-title">Otros</div>
      <div class="form-group full"><label>Notas</label><input id="f-notas" placeholder="Observaciones adicionales"></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeForm()">Cancelar</button>
      <button class="btn primary" id="btn-guardar" onclick="saveWorker()"><i class="ti ti-device-floppy"></i> Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-overlay" id="detail-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Detalle trabajador</span>
      <button class="modal-close" onclick="closeDetail()"><i class="ti ti-x"></i></button>
    </div>
    <div id="detail-content"></div>
    <div class="form-actions" id="detail-actions"></div>
  </div>
</div>

<!-- MODAL VACACIONES -->
<div class="modal-overlay" id="vac-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title"><i class="ti ti-beach"></i> Registrar vacaciones</span>
      <button class="modal-close" onclick="closeVacModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-fields">
      <div class="form-group full">
        <div style="font-size:14px;font-weight:600" id="vac-nombre"></div>
        <div style="font-size:13px;color:var(--ok);margin-top:4px" id="vac-saldo"></div>
      </div>
      <div class="form-group">
        <label>Fecha inicio *</label>
        <input id="vac-desde" type="date" onchange="calcVacDias()">
      </div>
      <div class="form-group">
        <label>Fecha termino *</label>
        <input id="vac-hasta" type="date" onchange="calcVacDias()">
      </div>
      <div class="form-group full">
        <div style="font-size:13px;font-weight:600;color:var(--blue)" id="vac-dias-calc"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeVacModal()">Cancelar</button>
      <button class="btn primary" onclick="saveVacaciones()"><i class="ti ti-device-floppy"></i> Registrar</button>
    </div>
  </div>
</div>

<script src="assets/app/app.js"></script>
</body>
</html>
